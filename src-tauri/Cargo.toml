[package]
name = "ai-job-assistant"
version = "0.1.0"
description = "AI 求职助手 - JD 采集与智能打分"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ai_job_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
